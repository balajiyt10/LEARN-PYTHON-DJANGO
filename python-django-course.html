<style>
:root{
  --ink:#181B20;

body{

/* ---------- Layout shell ---------- */

/* Sidebar */
.sidebar{

.sidebar::-webkit-scrollbar{width:8px;}

}

.nav-part{

}
.nav-part-label{

}

<div class="mobile-bar">
  <span class="mobile-bar-title">Python &amp; Django</span>

</div>

  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <p class="brand-title">Python <span class="amp">&amp;</span> Django</p>

    </div>
    <div id="nav-container"></div>

  <main class="main" id="main-content"></main>

<script>
// CHAPTERS array. Each chapter: id, part, track (py/dj), num, title, dek, content (HTML string)
const CHAPTERS = [];

function addChapter(c){ CHAPTERS.push(c); }

// Helper to build a code block
function code(lang, filename, src){
  const escaped = escapeHtml(src);
  const rawAttr = escaped.replace(/"/g,'&quot;');
  return `<div class="code-wrap">
    <div class="code-head"><span class="fname">${filename||lang}</span>
      <button class="copy-btn" onclick="copyCode(this)">copy</button>
    </div>
    <pre><code data-lang="${lang}" data-raw="${rawAttr}">${escaped}</code></pre>
  </div>`;
}
function output(text){
  return `<div class="output-wrap"><div class="output-label">OUTPUT</div>${escapeHtml(text).replace(/\n/g,'<br>')}</div>`;
}
function callout(type, label, html){
  return `<div class="callout ${type}"><div class="callout-label">${label}</div>${html}</div>`;
}
function exercise(html){
  return `<div class="exercise-box"><div class="ex-label">TRY IT YOURSELF</div>${html}</div>`;
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ============================================================
   PART 1 — PYTHON FOUNDATIONS
   ============================================================ */

addChapter({
  id:'py-intro',
  part:'Python · Foundations',
  track:'py',
  num:'1',
  title:'What Python Is, and Why It Exists',
  dek:'Before typing a single line, understand the problem Python was built to solve — that context makes every later rule make sense.',
  content:`
<h2>The core idea</h2>
<p>Python was created by Guido van Rossum and released in 1991. Its central promise is <strong>readability</strong>: code should look close to plain English, so that a person reading it six months later — often you — can understand it without re-deriving what it does.</p>
<p>Python is:</p>
<ul>
  <li><strong>Interpreted</strong> — code runs line by line through a program called the Python interpreter, rather than being compiled into machine code ahead of time. This makes development fast: you write, you run, you see results immediately.</li>
  <li><strong>Dynamically typed</strong> — you don't declare the type of a variable up front. A name can point to a number today and a string tomorrow. This speeds up writing code, at the cost of some errors only showing up when the code actually runs.</li>
  <li><strong>General-purpose</strong> — the same language builds web servers (Django, Flask), analyzes data (pandas, NumPy), automates tasks (scripts), trains machine learning models (PyTorch, TensorFlow), and more.</li>
</ul>

${callout('why', 'WHY THIS MATTERS', `<p>Every other language decision trades some of these properties for others. C is faster than Python but forces you to manage memory by hand and declare every type. JavaScript looks similar to Python but was built for the browser and has different quirks (like <code class="inline">this</code> binding). Knowing <em>why</em> Python looks the way it does helps you predict its behavior instead of memorizing it.</p>`)}

<h2>Installing Python</h2>
<p>Check what you already have — most Macs and Linux machines ship with some version of Python:</p>
${code('bash','terminal','python3 --version')}
${output('Python 3.12.4')}
<p>If that fails, install from <a href="https://python.org" target="_blank">python.org</a> (Windows/Mac) or your package manager on Linux (<code class="inline">sudo apt install python3</code> on Ubuntu/Debian). Always use <strong>Python 3</strong> — Python 2 was officially retired in 2020 and you will not encounter it in new projects.</p>

<h2>Running Python two ways</h2>
<h3>1. The interactive shell (REPL)</h3>
<p>Type <code class="inline">python3</code> in your terminal and you get a prompt where you can type code and see results instantly. This is where you experiment.</p>
${code('bash','terminal','$ python3\n>>> 2 + 2\n4\n>>> print("hello")\nhello')}

<h3>2. Running a script file</h3>
<p>For anything beyond a one-liner, you write code in a <code class="inline">.py</code> file and run the whole file.</p>
${code('python','hello.py',`print("Hello, world!")`)}
${code('bash','terminal','python3 hello.py')}
${output('Hello, world!')}

${exercise(`<p>Open a terminal, start the Python REPL, and try: <code class="inline">3 * 7</code>, then <code class="inline">"na" * 4</code>. Notice that <code class="inline">*</code> means something different for strings than for numbers — this is called <strong>operator overloading</strong>, and you'll meet it again later.</p>`)}
`
});

addChapter({
  id:'py-variables',
  part:'Python · Foundations',
  track:'py',
  num:'2',
  title:'Variables and Core Data Types',
  dek:'A variable is a label pointing at a value in memory. Understanding this model — not "a box that holds a value" — prevents a whole category of bugs later.',
  content:`
<h2>Assignment</h2>
${code('python','variables.py',`age = 25
name = "Maria"
height = 1.68
is_student = True`)}
<p>The <code class="inline">=</code> sign is <strong>assignment</strong>, not mathematical equality. Read <code class="inline">age = 25</code> as "make the name <code class="inline">age</code> point to the value <code class="inline">25</code>," not "age equals 25."</p>

${callout('why','WHY THIS MODEL MATTERS', `<p>Python variables are names attached to objects, not boxes containing values. When you write <code class="inline">b = a</code>, <code class="inline">b</code> now points to the <em>same object</em> as <code class="inline">a</code> — it doesn't copy it. For simple values like numbers this distinction is invisible, but for lists and dictionaries it explains bugs that otherwise look like magic. We'll revisit this precisely in the chapter on mutability.</p>`)}

<h2>The core built-in types</h2>
<table>
<tr><th>Type</th><th>Example</th><th>Used for</th></tr>
<tr><td><code class="inline">int</code></td><td><code class="inline">42</code></td><td>Whole numbers</td></tr>
<tr><td><code class="inline">float</code></td><td><code class="inline">3.14</code></td><td>Decimal numbers</td></tr>
<tr><td><code class="inline">str</code></td><td><code class="inline">"hello"</code></td><td>Text</td></tr>
<tr><td><code class="inline">bool</code></td><td><code class="inline">True</code> / <code class="inline">False</code></td><td>Yes/no logic</td></tr>
<tr><td><code class="inline">list</code></td><td><code class="inline">[1, 2, 3]</code></td><td>Ordered, changeable collections</td></tr>
<tr><td><code class="inline">tuple</code></td><td><code class="inline">(1, 2)</code></td><td>Ordered, unchangeable collections</td></tr>
<tr><td><code class="inline">dict</code></td><td><code class="inline">{"key": "value"}</code></td><td>Key → value lookups</td></tr>
<tr><td><code class="inline">set</code></td><td><code class="inline">{1, 2, 3}</code></td><td>Unique, unordered values</td></tr>
<tr><td><code class="inline">NoneType</code></td><td><code class="inline">None</code></td><td>Explicitly "nothing"</td></tr>
</table>

<p>Check a value's type at any time with the built-in <code class="inline">type()</code> function:</p>
${code('python','types.py',`print(type(42))
print(type(3.14))
print(type("hi"))
print(type([1, 2]))`)}
${output('<class \'int\'>\n<class \'float\'>\n<class \'str\'>\n<class \'list\'>')}

<h2>Naming rules</h2>
<ul>
  <li>Names can contain letters, numbers, and underscores, but can't start with a number.</li>
  <li>Python is case-sensitive: <code class="inline">age</code> and <code class="inline">Age</code> are different names.</li>
  <li>Convention (from a style guide called <strong>PEP 8</strong>) is <code class="inline">snake_case</code> for variables and functions: <code class="inline">first_name</code>, not <code class="inline">firstName</code> or <code class="inline">FirstName</code>.</li>
  <li>Don't shadow built-in names like <code class="inline">list</code>, <code class="inline">str</code>, or <code class="inline">type</code> — doing <code class="inline">list = [1,2,3]</code> works, but now the real <code class="inline">list()</code> function is inaccessible in that scope.</li>
</ul>

<h2>f-strings: building text from variables</h2>
<p>The modern, preferred way to combine variables and text is an f-string — put <code class="inline">f</code> before the quotes and <code class="inline">{}</code> around expressions:</p>
${code('python','fstrings.py',`name = "Maria"
age = 25
print(f"{name} is {age} years old")
print(f"Next year she'll be {age + 1}")`)}
${output("Maria is 25 years old\nNext year she'll be 26")}

${callout('real','REAL-WORLD CASE', `<p>f-strings are everywhere in real code: building log messages (<code class="inline">f"User {user_id} logged in at {timestamp}"</code>), generating SQL-adjacent strings, building URLs, and formatting error messages that get shown to users. You will write thousands of these.</p>`)}

${exercise(`<p>Create three variables: <code class="inline">first_name</code>, <code class="inline">last_name</code>, and <code class="inline">birth_year</code>. Write an f-string that prints: <em>"Full name: [First] [Last], age this year: [calculated age]"</em> — calculate the age using <code class="inline">2026 - birth_year</code> directly inside the f-string braces.</p>`)}
`
});

addChapter({
  id:'py-strings-numbers',
  part:'Python · Foundations',
  track:'py',
  num:'3',
  title:'Strings and Numbers in Depth',
  dek:'These two types show up in every program you will ever write. Knowing their methods well saves you from reinventing broken versions of them.',
  content:`
<h2>Numbers: int, float, and the operators</h2>
${code('python','numbers.py',`a = 17
b = 5

print(a + b)    # addition
print(a - b)    # subtraction
print(a * b)    # multiplication
print(a / b)    # division -> always returns a float
print(a // b)   # floor division -> rounds down to an int
print(a % b)    # modulo -> the remainder
print(a ** b)   # exponent -> a to the power of b`)}
${output('22\n12\n85\n3.4\n3\n2\n1419857')}

${callout('warn','A COMMON TRAP', `<p><code class="inline">/</code> always returns a <code class="inline">float</code>, even when the numbers divide evenly: <code class="inline">10 / 2</code> gives <code class="inline">5.0</code>, not <code class="inline">5</code>. If you need a whole number result, use <code class="inline">//</code>. This trips up beginners writing pagination logic or splitting things into batches.</p>`)}

<h2>Strings: the workhorse type</h2>
<p>Strings are immutable sequences of characters. "Immutable" means you cannot change a string in place — every string method returns a <em>new</em> string.</p>
${code('python','strings.py',`s = "  Hello, World!  "

print(s.strip())          # remove leading/trailing whitespace
print(s.lower())          # lowercase
print(s.upper())          # uppercase
print(s.strip().replace("World", "Python"))
print(len(s))              # length, including the spaces
print(s.strip().split(", ")) # split into a list`)}
${output('Hello, World!\n  hello, world!  \n  HELLO, WORLD!  \nHello, Python!\n19\n[\'Hello\', \'World!\']')}

<h3>Indexing and slicing</h3>
<p>Every string is a sequence you can index into. Python counts from <strong>0</strong>.</p>
${code('python','slicing.py',`word = "Python"
print(word[0])      # first character
print(word[-1])     # last character
print(word[0:3])    # characters 0, 1, 2 (not 3)
print(word[:3])     # same as above, "from the start"
print(word[3:])     # from index 3 to the end
print(word[::-1])   # the whole string, reversed`)}
${output('P\nn\nPyt\nPyt\nhon\nnohtyP')}

${callout('why','WHY SLICES WORK THIS WAY', `<p>The rule "start included, end excluded" feels odd at first, but it makes two things clean: <code class="inline">word[:3] + word[3:]</code> always reconstructs the full string with no overlap or gap, and the length of a slice is always <code class="inline">end - start</code>. Once you see it this way, off-by-one confusion mostly disappears.</p>`)}

<h2>Type conversion</h2>
<p>Data often arrives as the wrong type — especially user input, which is always a string.</p>
${code('python','conversion.py',`age_text = "25"
age_number = int(age_text)
print(age_number + 5)

price = 19.99
price_text = str(price)
print("Price: $" + price_text)`)}
${output('30\nPrice: $19.99')}

${callout('real','REAL-WORLD CASE', `<p>This is exactly what happens when a user fills out a form on a website: everything submitted through HTML forms arrives as text, even a number field. A Django view that receives an "age" field must convert it with <code class="inline">int()</code> before doing arithmetic on it — this exact pattern appears in almost every form-handling view you'll write.</p>`)}

${exercise(`<p>Given <code class="inline">sentence = "the quick brown fox"</code>, write code that: capitalizes the first letter of each word, and prints how many words there are. (Hint: look up the <code class="inline">.title()</code> method and the <code class="inline">.split()</code> method.)</p>`)}
`
});

addChapter({
  id:'py-collections',
  part:'Python · Foundations',
  track:'py',
  num:'4',
  title:'Lists, Tuples, Dictionaries, and Sets',
  dek:'Four ways to hold multiple values, each with different rules about order, uniqueness, and whether they can change — choosing the right one is a design decision, not a formality.',
  content:`
<h2>Lists: ordered and changeable</h2>
${code('python','lists.py',`fruits = ["apple", "banana", "cherry"]

fruits.append("date")           # add to the end
fruits.insert(0, "apricot")     # insert at a position
fruits.remove("banana")         # remove by value
print(fruits)
print(fruits[1])                # index access
print(len(fruits))
print("cherry" in fruits)       # membership check`)}
${output("['apricot', 'apple', 'cherry', 'date']\napple\n4\nTrue")}

<h2>Tuples: ordered and unchangeable</h2>
<p>Tuples look like lists but cannot be modified after creation. Use them for values that belong together and shouldn't change — like coordinates, or a fixed record.</p>
${code('python','tuples.py',`point = (3, 7)
x, y = point   # unpacking
print(f"x={x}, y={y}")

# point[0] = 5   # this would raise a TypeError — tuples are immutable`)}
${output('x=3, y=7')}

${callout('why','WHY BOTH EXIST', `<p>The choice between list and tuple is a signal to anyone reading your code (including future you). A tuple says "this is a fixed, small record — it won't grow or shrink." A list says "this is a collection I expect to change." Using a tuple also makes a value usable as a dictionary key, since dictionary keys must be immutable — lists can never be keys.</p>`)}

<h2>Dictionaries: key → value lookups</h2>
<p>The single most useful collection type in Python. Instead of looking things up by position (like a list), you look them up by a meaningful key.</p>
${code('python','dicts.py',`person = {
    "name": "Maria",
    "age": 25,
    "city": "Lisbon"
}

print(person["name"])
person["age"] = 26              # update
person["job"] = "Engineer"      # add a new key
print(person)

# Safe lookup — won't crash if the key doesn't exist
print(person.get("country", "Unknown"))

for key, value in person.items():
    print(f"{key}: {value}")`)}
${output("Maria\n{'name': 'Maria', 'age': 26, 'city': 'Lisbon', 'job': 'Engineer'}\nUnknown\nname: Maria\nage: 26\ncity: Lisbon\njob: Engineer")}

${callout('real','REAL-WORLD CASE', `<p>Dictionaries are how you'll represent almost every real-world "thing" before it becomes a database row: a user profile from an API response, a product's details, the data submitted from a web form. When Django reads a database row, it commonly hands it back to you as something dictionary-like. JSON — the format used by virtually every web API — maps directly onto Python dicts and lists.</p>`)}

<h2>Sets: unique, unordered values</h2>
${code('python','sets.py',`a = {1, 2, 3, 3, 2}    # duplicates are dropped automatically
print(a)

b = {2, 3, 4}
print(a & b)   # intersection: values in both
print(a | b)   # union: all values from both
print(a - b)   # difference: in a but not in b`)}
${output('{1, 2, 3}\n{2, 3}\n{1, 2, 3, 4}\n{1}')}

<h2>Choosing the right collection</h2>
<table>
<tr><th>Need</th><th>Use</th></tr>
<tr><td>Ordered, will change over time</td><td><code class="inline">list</code></td></tr>
<tr><td>Ordered, fixed, small record</td><td><code class="inline">tuple</code></td></tr>
<tr><td>Look up by meaningful name</td><td><code class="inline">dict</code></td></tr>
<tr><td>Only care about uniqueness, no order</td><td><code class="inline">set</code></td></tr>
</table>

${exercise(`<p>Build a dictionary called <code class="inline">inventory</code> mapping product names to quantities, e.g. <code class="inline">{"apples": 10, "bread": 3}</code>. Write a loop that prints <em>"LOW STOCK: [item]"</em> for anything with a quantity under 5.</p>`)}
`
});

addChapter({
  id:'py-control-flow',
  part:'Python · Foundations',
  track:'py',
  num:'5',
  title:'Control Flow: Conditionals and Loops',
  dek:'How your program makes decisions and repeats work. This is the machinery underneath validation logic, feed algorithms, and every "if this then that" you will ever write.',
  content:`
<h2>if / elif / else</h2>
${code('python','conditionals.py',`age = 20

if age < 13:
    category = "child"
elif age < 20:
    category = "teenager"
elif age < 65:
    category = "adult"
else:
    category = "senior"

print(category)`)}
${output('adult')}

${callout('why','WHY INDENTATION MATTERS', `<p>Python uses indentation (whitespace) to define blocks of code, instead of curly braces like many other languages. This isn't just a style choice enforced by convention — it's part of the language's grammar. Consistent 4-space indentation is not optional; misaligned indentation is a syntax error, not a style warning.</p>`)}

<h2>Comparison and logical operators</h2>
${code('python','operators.py',`x = 10
print(x == 10)          # equality
print(x != 5)            # not equal
print(x > 5 and x < 20)  # both must be true
print(x < 5 or x > 8)    # at least one true
print(not x == 10)       # negation`)}
${output('True\nTrue\nTrue\nTrue\nFalse')}

<h2>for loops: iterate over a known collection</h2>
${code('python','for_loops.py',`fruits = ["apple", "banana", "cherry"]

for fruit in fruits:
    print(fruit.capitalize())

# with index, using enumerate
for i, fruit in enumerate(fruits):
    print(f"{i}: {fruit}")

# a range of numbers
for n in range(3):        # 0, 1, 2 — stops before 3
    print(n)`)}
${output('Apple\nBanana\nCherry\n0: apple\n1: banana\n2: cherry\n0\n1\n2')}

<h2>while loops: repeat until a condition changes</h2>
${code('python','while_loops.py',`count = 0
while count < 3:
    print(f"count is {count}")
    count += 1
print("done")`)}
${output('count is 0\ncount is 1\ncount is 2\ndone')}

${callout('warn','AVOID INFINITE LOOPS', `<p>A <code class="inline">while</code> loop keeps running as long as its condition is true. If you forget to update the variable the condition depends on (<code class="inline">count += 1</code> above), the loop never ends — this will hang your program and, in a web server, can hang a request forever.</p>`)}

<h2>break, continue, and list comprehensions</h2>
${code('python','flow_control.py',`# break exits the loop entirely
for n in range(10):
    if n == 5:
        break
    print(n)

# continue skips to the next iteration
for n in range(5):
    if n % 2 == 0:
        continue
    print(n)

# list comprehension — build a list in one line
squares = [n * n for n in range(6)]
print(squares)

# with a filter condition
evens = [n for n in range(10) if n % 2 == 0]
print(evens)`)}
${output('0\n1\n2\n3\n4\n1\n3\n[0, 1, 4, 9, 16, 25]\n[0, 2, 4, 6, 8]')}

${callout('real','REAL-WORLD CASE', `<p>List comprehensions are how experienced Python developers filter and transform data in one readable line, instead of writing a four-line loop. You'll see them constantly in Django code — e.g. <code class="inline">[user.email for user in users if user.is_active]</code> — and in data processing scripts.</p>`)}

${exercise(`<p>Given <code class="inline">numbers = [4, 15, 22, 8, 42, 3, 19]</code>, write a list comprehension that returns only the numbers greater than 10, then a regular <code class="inline">for</code> loop that prints <em>"Found: [n]"</em> for each of those.</p>`)}
`
});

addChapter({
  id:'py-functions',
  part:'Python · Foundations',
  track:'py',
  num:'6',
  title:'Functions',
  dek:'Functions are how you stop repeating yourself and start building programs out of well-named, testable pieces.',
  content:`
<h2>Defining and calling a function</h2>
${code('python','functions.py',`def greet(name):
    return f"Hello, {name}!"

message = greet("Maria")
print(message)`)}
${output('Hello, Maria!')}

<p>The <code class="inline">def</code> keyword defines a function. Everything indented underneath belongs to it. <code class="inline">return</code> sends a value back to whoever called the function — without it, a function returns <code class="inline">None</code> by default.</p>

<h2>Default arguments and keyword arguments</h2>
${code('python','defaults.py',`def greet(name, greeting="Hello"):
    return f"{greeting}, {name}!"

print(greet("Maria"))
print(greet("Sam", "Hey"))
print(greet(name="Ana", greeting="Welcome"))   # keyword arguments, order doesn't matter`)}
${output('Hello, Maria!\nHey, Sam!\nWelcome, Ana!')}

${callout('warn','A CLASSIC TRAP', `<p>Never use a mutable value like <code class="inline">[]</code> or <code class="inline">{}</code> as a default argument. Python creates that default object <em>once</em>, when the function is defined — not fresh on every call — so it gets silently shared and mutated across calls. The safe pattern is <code class="inline">def f(items=None): items = items or []</code>.</p>`)}

<h2>*args and **kwargs: flexible arguments</h2>
${code('python','args_kwargs.py',`def total(*numbers):
    return sum(numbers)

print(total(1, 2, 3))
print(total(10, 20))

def describe(**details):
    for key, value in details.items():
        print(f"{key}: {value}")

describe(name="Maria", role="Engineer")`)}
${output('6\n30\nname: Maria\nrole: Engineer')}

<p><code class="inline">*args</code> collects any number of extra positional arguments into a tuple. <code class="inline">**kwargs</code> collects any number of extra named arguments into a dict. You'll see this constantly in Django's internals, where functions need to accept flexible input.</p>

<h2>Scope: where a variable lives</h2>
${code('python','scope.py',`x = "global"

def show():
    x = "local"
    print(x)

show()
print(x)`)}
${output('local\nglobal')}

<p>A variable created inside a function only exists inside that function (its <strong>local scope</strong>) unless you explicitly say otherwise. This is deliberate — it stops functions from accidentally stepping on each other's variables.</p>

${callout('real','REAL-WORLD CASE', `<p>Every Django view is a function (or a method on a class that behaves like one). It takes a request, does some work — often calling other smaller functions — and returns a response. Well-structured Django code is really just: many small, well-named, well-tested functions, composed together. The skill of writing clean functions here transfers directly.</p>`)}

${exercise(`<p>Write a function <code class="inline">calculate_discount(price, percent=10)</code> that returns the price after a percentage discount. Call it once with just a price, and once overriding the percent. Then write a second function <code class="inline">apply_all(prices, percent=10)</code> that uses a list comprehension to apply <code class="inline">calculate_discount</code> to every price in a list.</p>`)}
`
});

addChapter({
  id:'py-errors',
  part:'Python · Foundations',
  track:'py',
  num:'7',
  title:'Errors and Exception Handling',
  dek:'Things go wrong — bad input, missing files, network failures. Python gives you a structured way to expect that and handle it gracefully instead of crashing.',
  content:`
<h2>What an exception looks like</h2>
${code('python','error_example.py',`numbers = [1, 2, 3]
print(numbers[10])`)}
${output('Traceback (most recent call last):\n  File "error_example.py", line 2, in <module>\n    print(numbers[10])\nIndexError: list index out of range')}
<p>This is Python telling you exactly what went wrong (<code class="inline">IndexError</code>), where (<code class="inline">line 2</code>), and why (<code class="inline">list index out of range</code>). Reading tracebacks from the bottom up is the fastest way to find the actual cause.</p>

<h2>try / except</h2>
${code('python','try_except.py',`def safe_divide(a, b):
    try:
        result = a / b
    except ZeroDivisionError:
        print("Can't divide by zero!")
        return None
    else:
        return result
    finally:
        print("Division attempt finished")

print(safe_divide(10, 2))
print(safe_divide(10, 0))`)}
${output("Division attempt finished\n5.0\nCan't divide by zero!\nDivision attempt finished\nNone")}

<table>
<tr><th>Clause</th><th>Runs when</th></tr>
<tr><td><code class="inline">try</code></td><td>Always — contains the risky code</td></tr>
<tr><td><code class="inline">except</code></td><td>Only if a matching error occurred</td></tr>
<tr><td><code class="inline">else</code></td><td>Only if <em>no</em> error occurred</td></tr>
<tr><td><code class="inline">finally</code></td><td>Always, error or not — cleanup code</td></tr>
</table>

${callout('warn','CATCH SPECIFIC ERRORS', `<p>Avoid a bare <code class="inline">except:</code> with no error type — it silently swallows <em>every</em> possible error, including ones you didn't anticipate, like a typo in your own code. Catch the specific exception you expect (<code class="inline">ZeroDivisionError</code>, <code class="inline">ValueError</code>, <code class="inline">KeyError</code>) so real bugs still surface loudly.</p>`)}

<h2>Raising your own exceptions</h2>
${code('python','raise.py',`def set_age(age):
    if age < 0:
        raise ValueError("Age cannot be negative")
    return age

try:
    set_age(-5)
except ValueError as e:
    print(f"Invalid input: {e}")`)}
${output('Invalid input: Age cannot be negative')}

<h2>Common built-in exceptions</h2>
<table>
<tr><th>Exception</th><th>Typical cause</th></tr>
<tr><td><code class="inline">ValueError</code></td><td>Right type, wrong value — <code class="inline">int("abc")</code></td></tr>
<tr><td><code class="inline">TypeError</code></td><td>Wrong type entirely — <code class="inline">"a" + 5</code></td></tr>
<tr><td><code class="inline">KeyError</code></td><td>Dictionary key doesn't exist</td></tr>
<tr><td><code class="inline">IndexError</code></td><td>List index out of range</td></tr>
<tr><td><code class="inline">AttributeError</code></td><td>Calling a method/attribute that doesn't exist</td></tr>
<tr><td><code class="inline">FileNotFoundError</code></td><td>Opening a file that isn't there</td></tr>
</table>

${callout('real','REAL-WORLD CASE', `<p>In a Django application, this is exactly the pattern used when a user submits a payment form, an external API call fails, or a database write conflicts. Production web apps wrap risky operations in try/except so one failed request returns a clean error message instead of crashing the whole server process.</p>`)}

${exercise(`<p>Write a function <code class="inline">get_item(dictionary, key)</code> that returns <code class="inline">dictionary[key]</code>, but catches a <code class="inline">KeyError</code> and returns the string <em>"not found"</em> instead of crashing.</p>`)}
`
});

addChapter({
  id:'py-oop',
  part:'Python · Foundations',
  track:'py',
  num:'8',
  title:'Object-Oriented Programming',
  dek:'Classes let you bundle related data and behavior together. Django is built almost entirely from classes — understanding this well is what makes Django click later.',
  content:`
<h2>A class is a blueprint</h2>
${code('python','oop_basics.py',`class Dog:
    def __init__(self, name, breed):
        self.name = name
        self.breed = breed

    def bark(self):
        return f"{self.name} says Woof!"

my_dog = Dog("Rex", "Labrador")
print(my_dog.name)
print(my_dog.bark())`)}
${output('Rex\nRex says Woof!')}

<p><code class="inline">__init__</code> is the constructor — it runs automatically when you create a new object (<code class="inline">Dog("Rex", "Labrador")</code>). <code class="inline">self</code> refers to the specific object being worked with; it's always the first parameter of any regular method.</p>

${callout('why','WHY self IS EXPLICIT', `<p>Unlike some languages where "this" is implicit magic, Python makes <code class="inline">self</code> an explicit parameter you must write. This is a deliberate design choice: it makes clear, without any hidden rules, that instance methods are really just functions that take the object as their first argument. <code class="inline">my_dog.bark()</code> is exactly equivalent to <code class="inline">Dog.bark(my_dog)</code>.</p>`)}

<h2>Class attributes vs. instance attributes</h2>
${code('python','class_vs_instance.py',`class Dog:
    species = "Canis familiaris"   # class attribute — shared by all dogs

    def __init__(self, name):
        self.name = name            # instance attribute — unique per dog

a = Dog("Rex")
b = Dog("Fido")
print(a.species, b.species)   # same for both
print(a.name, b.name)          # different per instance`)}
${output('Canis familiaris Canis familiaris\nRex Fido')}

<h2>Inheritance: building on existing classes</h2>
${code('python','inheritance.py',`class Animal:
    def __init__(self, name):
        self.name = name

    def speak(self):
        return "..."

class Dog(Animal):
    def speak(self):
        return f"{self.name} says Woof!"

class Cat(Animal):
    def speak(self):
        return f"{self.name} says Meow!"

animals = [Dog("Rex"), Cat("Whiskers")]
for a in animals:
    print(a.speak())`)}
${output('Rex says Woof!\nWhiskers says Meow!')}

<p>Both <code class="inline">Dog</code> and <code class="inline">Cat</code> inherit from <code class="inline">Animal</code> and override its <code class="inline">speak</code> method with their own version. Calling the same method name and getting different behavior depending on the object's actual class is called <strong>polymorphism</strong>.</p>

<h2>super(): calling the parent's version</h2>
${code('python','super.py',`class Animal:
    def __init__(self, name):
        self.name = name

class Dog(Animal):
    def __init__(self, name, breed):
        super().__init__(name)   # reuse Animal's setup logic
        self.breed = breed

rex = Dog("Rex", "Labrador")
print(rex.name, rex.breed)`)}
${output('Rex Labrador')}

${callout('real','REAL-WORLD CASE', `<p>This exact pattern — subclassing and calling <code class="inline">super()</code> — is how nearly everything in Django works. Every model you write extends <code class="inline">django.db.models.Model</code>. Every class-based view extends a base view class. Every form extends <code class="inline">django.forms.Form</code>. Django hands you a huge amount of working behavior for free, and you customize it through inheritance, exactly like the <code class="inline">Dog</code> example above.</p>`)}

<h2>Encapsulation and properties</h2>
${code('python','properties.py',`class BankAccount:
    def __init__(self, balance):
        self._balance = balance   # underscore = "internal, please don't touch directly"

    @property
    def balance(self):
        return self._balance

    def deposit(self, amount):
        if amount <= 0:
            raise ValueError("Deposit must be positive")
        self._balance += amount

account = BankAccount(100)
account.deposit(50)
print(account.balance)   # read like an attribute, not a method call`)}
${output('150')}

<p>A leading underscore (<code class="inline">_balance</code>) is a convention signaling "internal use" — Python doesn't enforce privacy strictly, but respecting this convention keeps code predictable. <code class="inline">@property</code> lets you expose a method as if it were a plain attribute, useful for controlled, read-only access.</p>

${exercise(`<p>Write a class <code class="inline">Rectangle</code> with <code class="inline">width</code> and <code class="inline">height</code>, a method <code class="inline">area()</code>, and a method <code class="inline">perimeter()</code>. Then write a subclass <code class="inline">Square</code> that only takes a single <code class="inline">side</code> argument and calls <code class="inline">super().__init__(side, side)</code>.</p>`)}
`
});

   ============================================================ */

addChapter({
  id:'py-modules',
  part:'Python · Advanced',
  track:'py',
  num:'9',
  title:'Modules, Packages, and the Standard Library',
  dek:'No real program lives in a single file. Learn how Python code is organized, imported, and shared — the same mechanism Django itself is built from.',
  content:`
<h2>Splitting code into modules</h2>
<p>Any <code class="inline">.py</code> file is a <strong>module</strong>. You can import functions, classes, and variables from one file into another.</p>
${code('python','math_utils.py',`def add(a, b):
    return a + b

def square(x):
    return x * x`)}
${code('python','main.py',`import math_utils

print(math_utils.add(2, 3))
print(math_utils.square(4))

# or import specific names directly
from math_utils import add
print(add(10, 20))`)}
${output('5\n16\n30')}

<h2>Packages: folders of modules</h2>
<p>A <strong>package</strong> is a folder containing related modules, marked with an <code class="inline">__init__.py</code> file (which can be empty).</p>
${code('bash','structure','myproject/\n  shapes/\n    __init__.py\n    circle.py\n    square.py\n  main.py')}
${code('python','main.py',`from shapes.circle import area as circle_area
from shapes import square

print(circle_area(5))`)}

${callout('why','WHY THIS MATTERS FOR DJANGO', `<p>A Django project <em>is</em> a Python package. Every "app" inside it (like <code class="inline">blog/</code> or <code class="inline">accounts/</code>) is itself a package with <code class="inline">models.py</code>, <code class="inline">views.py</code>, <code class="inline">urls.py</code> inside it. Once you understand imports and packages, Django's folder structure stops looking mysterious — it's the same pattern you just learned, at a larger scale.</p>`)}

<h2>The standard library: batteries included</h2>
<p>Python ships with a huge amount of built-in functionality — no installation needed.</p>
${code('python','stdlib.py',`import datetime
import json
import os
import random

now = datetime.datetime.now()
print(now.year)

data = {"name": "Maria", "age": 25}
json_text = json.dumps(data)
print(json_text)

print(os.getcwd())            # current working directory
print(random.randint(1, 10))  # random number 1-10`)}
${output("2026\n{\"name\": \"Maria\", \"age\": 25}\n/home/user/project\n7")}

<h2>Installing third-party packages with pip</h2>
${code('bash','terminal',`pip install requests`)}
${code('python','using_requests.py',`import requests

response = requests.get("https://api.github.com")
print(response.status_code)
print(response.json())`)}

${callout('warn','ALWAYS USE VIRTUAL ENVIRONMENTS', `<p>Never install packages directly into your system Python. Different projects need different, sometimes conflicting, package versions. A <strong>virtual environment</strong> isolates each project's dependencies. This becomes essential — not optional — the moment you start a Django project.</p>`)}
${code('bash','terminal',`python3 -m venv venv          # create a virtual environment
source venv/bin/activate      # activate it (Mac/Linux)
venv\\Scripts\\activate         # activate it (Windows)
pip install django            # now installs only into this environment
deactivate                    # leave the environment`)}

${exercise(`<p>Create a virtual environment, activate it, and run <code class="inline">pip install requests</code>. Then write a script that fetches <code class="inline">https://api.github.com</code> and prints the response's status code.</p>`)}
`
});

addChapter({
  id:'py-files',
  part:'Python · Advanced',
  track:'py',
  num:'10',
  title:'Working with Files and JSON',
  dek:'Reading and writing files is the bridge between your program and the outside world — configuration, logs, data exports all flow through this.',
  content:`
<h2>Reading and writing text files</h2>
${code('python','file_write.py',`with open("notes.txt", "w") as f:
    f.write("First line\\n")
    f.write("Second line\\n")`)}
${code('python','file_read.py',`with open("notes.txt", "r") as f:
    contents = f.read()
    print(contents)

# or line by line
with open("notes.txt", "r") as f:
    for line in f:
        print(line.strip())`)}
${output('First line\nSecond line\nFirst line\nSecond line')}

${callout('why','WHY THE with BLOCK', `<p><code class="inline">with open(...) as f:</code> is a <strong>context manager</strong>. It guarantees the file gets closed automatically when the block ends — even if an error happens inside it. Without <code class="inline">with</code>, you'd need a manual <code class="inline">f.close()</code> and could easily forget it, leaking file handles. This pattern (setup → work → guaranteed cleanup) reappears throughout Python, including in database connections.</p>`)}

<h2>File modes</h2>
<table>
<tr><th>Mode</th><th>Meaning</th></tr>
<tr><td><code class="inline">"r"</code></td><td>Read (default) — file must exist</td></tr>
<tr><td><code class="inline">"w"</code></td><td>Write — creates the file, overwrites if it exists</td></tr>
<tr><td><code class="inline">"a"</code></td><td>Append — adds to the end without erasing existing content</td></tr>
<tr><td><code class="inline">"r+"</code></td><td>Read and write</td></tr>
</table>

<h2>JSON: the universal data format</h2>
<p>JSON (JavaScript Object Notation) maps almost directly onto Python dicts and lists, and is the format nearly all web APIs use to send data.</p>
${code('python','json_example.py',`import json

data = {
    "name": "Maria",
    "skills": ["Python", "Django", "SQL"],
    "active": True
}

# Python object -> JSON string
with open("profile.json", "w") as f:
    json.dump(data, f, indent=2)

# JSON string -> Python object
with open("profile.json", "r") as f:
    loaded = json.load(f)
    print(loaded["skills"])`)}
${output("['Python', 'Django', 'SQL']")}

${callout('real','REAL-WORLD CASE', `<p>When your Django app talks to a payment provider, a mapping API, or any external service, the request and response bodies are JSON. Django REST Framework — the standard tool for building APIs in Django — is essentially a very sophisticated system for converting between Python objects (your database models) and JSON, in both directions.</p>`)}

${exercise(`<p>Create a list of three dictionaries, each representing a book (<code class="inline">title</code>, <code class="inline">author</code>, <code class="inline">year</code>). Write it to a file called <code class="inline">books.json</code> using <code class="inline">json.dump</code>, then write a second script that reads it back and prints each book's title.</p>`)}
`
});

addChapter({
  id:'py-advanced-features',
  part:'Python · Advanced',
  track:'py',
  num:'11',
  title:'Decorators, Generators, and Comprehensions',
  dek:'These features look intimidating from the outside but appear constantly in real Django codebases — you need to recognize and read them fluently.',
  content:`
<h2>Decorators: functions that wrap functions</h2>
<p>A decorator takes a function, adds behavior around it, and returns a new function. The <code class="inline">@</code> syntax is shorthand for "wrap this function with that decorator."</p>
${code('python','decorators.py',`import time

def timer(func):
    def wrapper(*args, **kwargs):
        start = time.time()
        result = func(*args, **kwargs)
        end = time.time()
        print(f"{func.__name__} took {end - start:.4f}s")
        return result
    return wrapper

@timer
def slow_function():
    time.sleep(1)
    return "done"

slow_function()`)}
${output('slow_function took 1.0004s')}

<p>The line <code class="inline">@timer</code> above <code class="inline">def slow_function():</code> is exactly equivalent to writing <code class="inline">slow_function = timer(slow_function)</code>.</p>

${callout('real','REAL-WORLD CASE', `<p>You will use decorators constantly in Django without writing your own: <code class="inline">@login_required</code> protects a view so only logged-in users can access it. <code class="inline">@require_POST</code> restricts a view to only accept POST requests. Understanding that a decorator is just "a function wrapping your function" demystifies what's actually happening.</p>`)}

<h2>Generators: lazy sequences</h2>
<p>A generator produces values one at a time, on demand, instead of building the entire sequence in memory up front. You define one with <code class="inline">yield</code> instead of <code class="inline">return</code>.</p>
${code('python','generators.py',`def count_up_to(n):
    i = 1
    while i <= n:
        yield i
        i += 1

for number in count_up_to(5):
    print(number)`)}
${output('1\n2\n3\n4\n5')}

${callout('why','WHY THIS MATTERS FOR MEMORY', `<p>Imagine processing a database table with 50 million rows. A regular function that builds a list of all 50 million rows would consume enormous memory. A generator yields one row at a time — the previous one can be garbage collected before the next is produced. Django's QuerySets behave this way by default for exactly this reason.</p>`)}

<h2>Comprehensions, beyond lists</h2>
${code('python','comprehensions.py',`# dict comprehension
squares = {n: n*n for n in range(5)}
print(squares)

# set comprehension
unique_lengths = {len(word) for word in ["cat", "dog", "bird", "ox"]}
print(unique_lengths)

# generator expression — like a list comprehension, but lazy
total = sum(n*n for n in range(1000000))   # never builds the full list in memory
print(total)`)}
${output('{0: 0, 1: 1, 2: 4, 3: 9, 4: 16}\n{2, 3, 4}\n333332833333500000')}

<h2>Context managers, custom ones</h2>
${code('python','context_manager.py',`class Timer:
    def __enter__(self):
        import time
        self.start = time.time()
        return self

    def __exit__(self, exc_type, exc_val, exc_tb):
        import time
        print(f"Elapsed: {time.time() - self.start:.4f}s")

with Timer():
    total = sum(range(1000000))`)}
${output('Elapsed: 0.0231s')}

${exercise(`<p>Write a decorator called <code class="inline">log_call</code> that prints <em>"Calling [function name]"</em> before running the function, and apply it to a simple function of your choice. Then write a generator function <code class="inline">even_numbers(limit)</code> that yields even numbers from 0 up to <code class="inline">limit</code>.</p>`)}
`
});

addChapter({
  id:'dj-intro',
  part:'Django · Foundations',
  track:'dj',
  num:'12',
  title:'What Django Is, and How the Web Works',
  dek:'Before the first line of Django code, understand the request/response cycle it automates — this mental model is the map you\'ll use for the rest of the course.',
  content:`
<h2>What happens when you visit a website</h2>
<ol>
  <li>Your browser sends an <strong>HTTP request</strong> to a server — e.g. "GET me the page at /products/42".</li>
  <li>The server figures out what that URL means, runs some code, usually reads or writes to a database.</li>
  <li>The server sends back an <strong>HTTP response</strong> — typically HTML, sometimes JSON, sometimes an error.</li>
  <li>The browser renders that response into what you see on screen.</li>
</ol>

${callout('why','WHY DJANGO EXISTS', `<p>Every dynamic website needs to solve the same problems: map URLs to code, talk to a database safely, handle forms, manage user logins, prevent common security holes. Django is a <strong>batteries-included web framework</strong> that solves all of these once, well, so you don't rebuild them from scratch for every project. It was extracted from a real newsroom's codebase in 2003–2005, which is why it's unusually good at content-heavy sites.</p>`)}

<h2>Django's shape: MVT</h2>
<p>Django organizes code using a pattern it calls <strong>Model-View-Template</strong> (a close cousin of the more widely known MVC pattern):</p>
<table>
<tr><th>Piece</th><th>Job</th></tr>
<tr><td><strong>Model</strong></td><td>Defines your data and talks to the database</td></tr>
<tr><td><strong>View</strong></td><td>Contains the logic — receives a request, decides what to do, returns a response</td></tr>
<tr><td><strong>Template</strong></td><td>The HTML that gets sent back, with placeholders for dynamic data</td></tr>
<tr><td><strong>URL dispatcher</strong></td><td>Maps a URL pattern to the view that should handle it</td></tr>
</table>

<p>The flow for a single request: <strong>URL dispatcher</strong> receives the request and picks a <strong>view</strong> → the view asks a <strong>model</strong> for data → the view hands that data to a <strong>template</strong> → the rendered HTML goes back as the response.</p>

${callout('real','REAL-WORLD CASE', `<p>Instagram, Pinterest, Spotify's backend tooling, The Washington Post, and Robinhood have all used Django in production at scale. It's a genuinely production-grade choice, not a toy — the same patterns you learn in this course scale to real companies.</p>`)}

<h2>Installing Django</h2>
${code('bash','terminal',`python3 -m venv venv
source venv/bin/activate
pip install django
python3 -m django --version`)}
${output('5.1.3')}

${exercise(`<p>Create a virtual environment, activate it, and install Django. Confirm it worked by checking the version, as shown above.</p>`)}
`
});

addChapter({
  id:'dj-first-project',
  part:'Django · Foundations',
  track:'dj',
  num:'13',
  title:'Your First Django Project',
  dek:'Create a real, running project and understand exactly what each generated file does — no piece of Django\'s scaffolding is arbitrary.',
  content:`
<h2>Starting a project</h2>
${code('bash','terminal',`django-admin startproject mysite
cd mysite
python3 manage.py runserver`)}
${output('Watching for file changes with StatReloader\nStarting development server at http://127.0.0.1:8000/\nQuit the server with CONTROL-C.')}

<p>Visit <code class="inline">http://127.0.0.1:8000/</code> in a browser — you'll see Django's default welcome page. This confirms the development server, database connection, and settings are all working.</p>

<h2>What startproject generated</h2>
${code('bash','structure',`mysite/
  manage.py
  mysite/
    __init__.py
    settings.py
    urls.py
    asgi.py
    wsgi.py`)}
<table>
<tr><th>File</th><th>Purpose</th></tr>
<tr><td><code class="inline">manage.py</code></td><td>Command-line utility for running the server, managing the database, and more</td></tr>
<tr><td><code class="inline">settings.py</code></td><td>All project configuration — database, installed apps, security settings</td></tr>
<tr><td><code class="inline">urls.py</code></td><td>The project-wide URL routing table</td></tr>
<tr><td><code class="inline">wsgi.py</code> / <code class="inline">asgi.py</code></td><td>Entry points used by production web servers to run your app</td></tr>
</table>

<h2>Projects vs. apps</h2>
<p>A Django <strong>project</strong> is the whole website. An <strong>app</strong> is a self-contained module inside it handling one concern — blog posts, user accounts, a shopping cart. A project can contain many apps, and well-designed apps can even be reused across different projects.</p>
${code('bash','terminal',`python3 manage.py startapp blog`)}
${code('bash','structure',`blog/
  migrations/
  __init__.py
  admin.py
  apps.py
  models.py
  tests.py
  views.py`)}

${callout('why','WHY SPLIT INTO APPS', `<p>This isn't bureaucracy — it's the same modularity principle from Python packages, applied at the web-framework level. A <code class="inline">blog</code> app knows nothing about a <code class="inline">payments</code> app. This keeps each piece small enough to understand fully, testable in isolation, and — if designed cleanly — reusable in a future project.</p>`)}

<p>Register the new app in the project's settings so Django knows it exists:</p>
${code('python','mysite/settings.py',`INSTALLED_APPS = [
    'django.contrib.admin',
    'django.contrib.auth',
    'django.contrib.contenttypes',
    'django.contrib.sessions',
    'django.contrib.messages',
    'django.contrib.staticfiles',
    'blog',   # <- our new app
]`)}

${exercise(`<p>Create a project called <code class="inline">mysite</code>, run the dev server, and confirm the welcome page loads. Then create an app called <code class="inline">blog</code> and add it to <code class="inline">INSTALLED_APPS</code>.</p>`)}
`
});

addChapter({
  id:'dj-views-urls',
  part:'Django · Foundations',
  track:'dj',
  num:'14',
  title:'Views and URL Routing',
  dek:'This is the first piece of the request/response cycle you\'ll build by hand: mapping a URL to the code that handles it.',
  content:`
<h2>A minimal view</h2>
<p>A view is a Python function (or class) that takes a request and returns a response.</p>
${code('python','blog/views.py',`from django.http import HttpResponse

def home(request):
    return HttpResponse("Welcome to the blog!")

def post_detail(request, post_id):
    return HttpResponse(f"You're viewing post #{post_id}")`)}

<h2>Wiring up URLs</h2>
<p>Each app gets its own <code class="inline">urls.py</code>, and the project's main <code class="inline">urls.py</code> includes it.</p>
${code('python','blog/urls.py',`from django.urls import path
from . import views

urlpatterns = [
    path('', views.home, name='home'),
    path('post/<int:post_id>/', views.post_detail, name='post_detail'),
]`)}
${code('python','mysite/urls.py',`from django.contrib import admin
from django.urls import path, include

urlpatterns = [
    path('admin/', admin.site.urls),
    path('', include('blog.urls')),
]`)}

<p>Now visiting <code class="inline">/</code> calls <code class="inline">home</code>, and <code class="inline">/post/7/</code> calls <code class="inline">post_detail</code> with <code class="inline">post_id=7</code> — Django converts the URL segment to an <code class="inline">int</code> automatically because of the <code class="inline">&lt;int:post_id&gt;</code> converter.</p>

${callout('why','WHY name= MATTERS', `<p>Giving a URL pattern a <code class="inline">name</code> lets you reference it elsewhere in your code without hardcoding the path string — <code class="inline">reverse('post_detail', args=[7])</code> or, in a template, <code class="inline">{% url 'post_detail' post.id %}</code>. If you ever change the URL structure (say, from <code class="inline">/post/7/</code> to <code class="inline">/articles/7/</code>), every reference updates automatically because nothing else hardcodes the literal path.</p>`)}

<h2>Path converters</h2>
<table>
<tr><th>Converter</th><th>Matches</th></tr>
<tr><td><code class="inline">str</code></td><td>Any non-empty string, excluding <code class="inline">/</code> (default)</td></tr>
<tr><td><code class="inline">int</code></td><td>Whole numbers</td></tr>
<tr><td><code class="inline">slug</code></td><td>Letters, numbers, hyphens, underscores — good for URL-friendly titles</td></tr>
<tr><td><code class="inline">uuid</code></td><td>A formatted UUID string</td></tr>
<tr><td><code class="inline">path</code></td><td>Any string, including <code class="inline">/</code></td></tr>
</table>

${code('python','blog/urls.py',`path('post/<slug:slug>/', views.post_detail, name='post_detail'),`)}

${callout('real','REAL-WORLD CASE', `<p>This is why real blog URLs look like <code class="inline">/post/how-i-learned-django/</code> instead of <code class="inline">/post/7/</code> — it's more readable and better for search engines. That's a <code class="inline">slug</code> converter capturing a human-readable identifier instead of a raw database ID.</p>`)}

${exercise(`<p>Add a new view <code class="inline">about(request)</code> returning a short bio, hooked up to the URL <code class="inline">/about/</code> with the name <code class="inline">'about'</code>. Confirm it loads in the browser.</p>`)}
`
});

addChapter({
  id:'dj-models',
  part:'Django · Foundations',
  track:'dj',
  num:'15',
  title:'Models and the Database (the ORM)',
  dek:'This is the heart of Django: you describe your data as Python classes, and Django handles turning that into database tables and SQL queries for you.',
  content:`
<h2>Defining a model</h2>
${code('python','blog/models.py',`from django.db import models

class Post(models.Model):
    title = models.CharField(max_length=200)
    slug = models.SlugField(unique=True)
    body = models.TextField()
    published = models.BooleanField(default=False)
    created_at = models.DateTimeField(auto_now_add=True)
    updated_at = models.DateTimeField(auto_now=True)

    def __str__(self):
        return self.title`)}

<p>Each class attribute becomes a database column. Django reads the field type to decide the column type, validation rules, and the form widget it'll use if this field ever appears in a form.</p>

${callout('why','WHY AN ORM', `<p>An <strong>ORM</strong> (Object-Relational Mapper) lets you work with Python objects instead of writing raw SQL for every query. Beyond convenience, it gives you database portability (switch from SQLite to PostgreSQL with a settings change, not a rewrite), and it automatically escapes values to prevent SQL injection — one of the most common and dangerous web vulnerabilities.</p>`)}

<h2>Common field types</h2>
<table>
<tr><th>Field</th><th>Stores</th></tr>
<tr><td><code class="inline">CharField(max_length=...)</code></td><td>Short text — requires a max length</td></tr>
<tr><td><code class="inline">TextField()</code></td><td>Long text, no length limit</td></tr>
<tr><td><code class="inline">IntegerField()</code></td><td>Whole numbers</td></tr>
<tr><td><code class="inline">DecimalField(max_digits, decimal_places)</code></td><td>Precise decimals — always use this for money, never <code class="inline">FloatField</code></td></tr>
<tr><td><code class="inline">BooleanField()</code></td><td>True/False</td></tr>
<tr><td><code class="inline">DateTimeField()</code></td><td>Date and time</td></tr>
<tr><td><code class="inline">ForeignKey(Model, on_delete=...)</code></td><td>A link to another model — many-to-one</td></tr>
<tr><td><code class="inline">ManyToManyField(Model)</code></td><td>A link where either side can relate to many of the other</td></tr>
</table>

<h2>Migrations: turning models into database tables</h2>
${code('bash','terminal',`python3 manage.py makemigrations
python3 manage.py migrate`)}
${output('Migrations for \'blog\':\n  blog/migrations/0001_initial.py\n    - Create model Post\nOperations to perform:\n  Apply all migrations: admin, auth, blog, contenttypes, sessions\nRunning migrations:\n  Applying blog.0001_initial... OK')}

${callout('why','WHY TWO SEPARATE COMMANDS', `<p><code class="inline">makemigrations</code> looks at your models and writes a migration file describing the change — it does not touch the database. <code class="inline">migrate</code> actually applies that file to the database. Splitting these lets you review the generated migration before running it, and lets your team commit migration files to version control so everyone's database schema stays in sync.</p>`)}

<h2>Querying with the ORM (the shell)</h2>
${code('bash','terminal',`python3 manage.py shell`)}
${code('python','django shell',`from blog.models import Post

# create
Post.objects.create(title="Hello Django", slug="hello-django", body="My first post")

# read - all
Post.objects.all()

# read - filtered
Post.objects.filter(published=True)
Post.objects.get(slug="hello-django")   # get() expects exactly one match

# update
post = Post.objects.get(slug="hello-django")
post.published = True
post.save()

# delete
post.delete()`)}

<h2>Relationships between models</h2>
${code('python','blog/models.py',`from django.db import models
from django.contrib.auth.models import User

class Category(models.Model):
    name = models.CharField(max_length=100)

    def __str__(self):
        return self.name

class Post(models.Model):
    title = models.CharField(max_length=200)
    author = models.ForeignKey(User, on_delete=models.CASCADE, related_name='posts')
    category = models.ForeignKey(Category, on_delete=models.SET_NULL, null=True)
    body = models.TextField()

    def __str__(self):
        return self.title`)}

${code('python','django shell',`# access related objects
post = Post.objects.first()
print(post.author.username)      # forward relation
print(post.author.posts.all())   # reverse relation, via related_name`)}

${callout('real','REAL-WORLD CASE', `<p><code class="inline">on_delete</code> is not boilerplate — it's a real business decision. <code class="inline">CASCADE</code> deletes a user's posts if the user is deleted (used above for author). <code class="inline">SET_NULL</code> keeps the post but clears the category if that category is deleted (used above, requires <code class="inline">null=True</code>). <code class="inline">PROTECT</code> refuses to delete the related row at all if anything still references it — useful for things like order records you legally must retain.</p>`)}

${exercise(`<p>Add a <code class="inline">Comment</code> model with a <code class="inline">ForeignKey</code> to <code class="inline">Post</code> (use <code class="inline">related_name='comments'</code>), a <code class="inline">body</code> field, and a <code class="inline">created_at</code> field. Run the migrations, then use the shell to create one comment on an existing post and print <code class="inline">post.comments.all()</code>.</p>`)}
`
});

addChapter({
  id:'dj-admin',
  part:'Django · Foundations',
  track:'dj',
  num:'16',
  title:'The Django Admin',
  dek:'A free, auto-generated interface for managing your data — one of Django\'s most famous features, and a huge productivity advantage over building this from scratch.',
  content:`
<h2>Creating a superuser</h2>
${code('bash','terminal',`python3 manage.py createsuperuser`)}
<p>Follow the prompts for a username, email, and password. Then visit <code class="inline">/admin/</code> and log in.</p>

<h2>Registering a model</h2>
${code('python','blog/admin.py',`from django.contrib import admin
from .models import Post, Category

admin.site.register(Post)
admin.site.register(Category)`)}
<p>That's it — reload <code class="inline">/admin/</code> and you'll have a full create/read/update/delete interface for <code class="inline">Post</code> and <code class="inline">Category</code>, with no HTML written by you.</p>

<h2>Customizing the admin</h2>
${code('python','blog/admin.py',`from django.contrib import admin
from .models import Post, Category

@admin.register(Post)
class PostAdmin(admin.ModelAdmin):
    list_display = ('title', 'author', 'published', 'created_at')
    list_filter = ('published', 'category')
    search_fields = ('title', 'body')
    prepopulated_fields = {'slug': ('title',)}

admin.site.register(Category)`)}

<table>
<tr><th>Option</th><th>Effect</th></tr>
<tr><td><code class="inline">list_display</code></td><td>Which columns show in the list view</td></tr>
<tr><td><code class="inline">list_filter</code></td><td>Adds a sidebar to filter by these fields</td></tr>
<tr><td><code class="inline">search_fields</code></td><td>Adds a search box over these fields</td></tr>
<tr><td><code class="inline">prepopulated_fields</code></td><td>Auto-fills a slug from another field as you type</td></tr>
</table>

${callout('real','REAL-WORLD CASE', `<p>Many real companies run their entire internal "back office" on the Django admin, customized like this, without building a separate internal tool at all. A newsroom's editors publish articles through it; a small e-commerce team manages orders through it. Knowing how to configure it well is a genuinely valuable, practical skill — not just a learning exercise.</p>`)}

${exercise(`<p>Register your <code class="inline">Comment</code> model from the previous chapter. Customize its admin so the list view shows the post title, a preview of the comment body, and the creation date, and add a search box over the comment body.</p>`)}
`
});

addChapter({
  id:'dj-templates',
  part:'Django · Foundations',
  track:'dj',
  num:'17',
  title:'Templates: Rendering HTML',
  dek:'How Django turns your Python data into the HTML a browser actually displays — with a deliberately restricted language to keep logic out of your presentation layer.',
  content:`
<h2>Rendering a template from a view</h2>
${code('python','blog/views.py',`from django.shortcuts import render, get_object_or_404
from .models import Post

def post_list(request):
    posts = Post.objects.filter(published=True).order_by('-created_at')
    return render(request, 'blog/post_list.html', {'posts': posts})

def post_detail(request, slug):
    post = get_object_or_404(Post, slug=slug, published=True)
    return render(request, 'blog/post_detail.html', {'post': post})`)}

<p>Templates live in each app's <code class="inline">templates/&lt;app_name&gt;/</code> folder by convention, which avoids naming collisions between apps.</p>
${code('bash','structure',`blog/
  templates/
    blog/
      base.html
      post_list.html
      post_detail.html`)}

<h2>Template syntax</h2>
${code('django','blog/templates/blog/post_list.html',`{% extends "blog/base.html" %}

{% block content %}
  <h1>Latest Posts</h1>

  {% if posts %}
    <ul>
    {% for post in posts %}
      <li>
        <a href="{% url 'post_detail' post.slug %}">{{ post.title }}</a>
        <span>{{ post.created_at|date:"F j, Y" }}</span>
      </li>
    {% endfor %}
    </ul>
  {% else %}
    <p>No posts yet.</p>
  {% endif %}
{% endblock %}`)}

<table>
<tr><th>Syntax</th><th>Purpose</th></tr>
<tr><td><code class="inline">{{ variable }}</code></td><td>Print a value</td></tr>
<tr><td><code class="inline">{% tag %}</code></td><td>Logic: loops, conditionals, template inheritance</td></tr>
<tr><td><code class="inline">{{ value|filter }}</code></td><td>Transform a value for display, e.g. formatting a date</td></tr>
<tr><td><code class="inline">{% url 'name' arg %}</code></td><td>Build a URL from its name, never hardcode paths</td></tr>
</table>

${callout('why','WHY THE TEMPLATE LANGUAGE IS DELIBERATELY LIMITED', `<p>You cannot call arbitrary Python from a template, or run a raw database query. This is intentional: it keeps business logic in views and models where it can be tested and reasoned about, and keeps templates focused purely on presentation. It also means a designer who doesn't know Python can safely edit templates without breaking application logic.</p>`)}

<h2>Template inheritance</h2>
${code('django','blog/templates/blog/base.html',`<!DOCTYPE html>
<html>
<head>
  <title>{% block title %}My Blog{% endblock %}</title>
</head>
<body>
  <nav><a href="{% url 'post_list' %}">Home</a></nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>`)}

<p>Any page extending <code class="inline">base.html</code> gets the shared header and navigation automatically, and only needs to fill in <code class="inline">{% block content %}</code>. This is how real sites avoid copy-pasting the same layout into every page.</p>

${callout('warn','AUTO-ESCAPING KEEPS YOU SAFE', `<p>Django auto-escapes every variable printed with <code class="inline">{{ }}</code> — if a blog comment contained <code class="inline">&lt;script&gt;alert('hi')&lt;/script&gt;</code>, Django renders it as visible text, not executable code. This is your main defense against <strong>Cross-Site Scripting (XSS)</strong>. Only disable it (<code class="inline">|safe</code>) for content you fully trust and control.</p>`)}

${exercise(`<p>Create <code class="inline">post_detail.html</code> extending your base template, showing the post's title, body, and a list of its comments using a <code class="inline">{% for %}</code> loop. Add an <code class="inline">{% if %}</code> that shows "No comments yet" when the list is empty.</p>`)}
`
});

addChapter({
  id:'dj-forms',
  part:'Django · Foundations',
  track:'dj',
  num:'18',
  title:'Forms and Handling User Input',
  dek:'Every place a user types something into your site — signup, comments, checkout — flows through Django\'s forms system. It handles validation and security for you.',
  content:`
<h2>A ModelForm</h2>
<p>The fastest way to build a form that maps directly onto a model.</p>
${code('python','blog/forms.py',`from django import forms
from .models import Comment

class CommentForm(forms.ModelForm):
    class Meta:
        model = Comment
        fields = ['author_name', 'body']`)}

<h2>Handling GET vs. POST in a view</h2>
${code('python','blog/views.py',`from django.shortcuts import render, redirect, get_object_or_404
from .models import Post
from .forms import CommentForm

def post_detail(request, slug):
    post = get_object_or_404(Post, slug=slug)

    if request.method == 'POST':
        form = CommentForm(request.POST)
        if form.is_valid():
            comment = form.save(commit=False)   # don't save yet, need to attach the post
            comment.post = post
            comment.save()
            return redirect('post_detail', slug=post.slug)
    else:
        form = CommentForm()

    return render(request, 'blog/post_detail.html', {'post': post, 'form': form})`)}

${callout('why','WHY THE GET/POST BRANCH IS A STANDARD PATTERN', `<p>A <code class="inline">GET</code> request just wants to view the page with a blank form. A <code class="inline">POST</code> request means the user submitted data that needs validating and saving. <code class="inline">redirect()</code> after a successful save is deliberate — it prevents the classic "duplicate form submission on page refresh" bug, because refreshing re-sends a <code class="inline">GET</code> for the new URL, not the original <code class="inline">POST</code>. This is called the <strong>Post/Redirect/Get</strong> pattern.</p>`)}

<h2>Rendering the form in a template</h2>
${code('django','blog/templates/blog/post_detail.html',`<h1>{{ post.title }}</h1>
<p>{{ post.body }}</p>

<h2>Leave a comment</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Post comment</button>
</form>`)}

${callout('warn','NEVER FORGET {% csrf_token %}', `<p>Every form that submits via POST needs this tag. It inserts a hidden, unique token that Django checks on submission to confirm the request genuinely came from your own site — not from a malicious page tricking a logged-in user's browser into submitting a request on their behalf. This defends against <strong>Cross-Site Request Forgery (CSRF)</strong>. Django will actively reject POST requests missing a valid token.</p>`)}

<h2>Validation: automatic and custom</h2>
${code('python','blog/forms.py',`from django import forms
from .models import Comment

class CommentForm(forms.ModelForm):
    class Meta:
        model = Comment
        fields = ['author_name', 'body']

    def clean_body(self):
        body = self.cleaned_data['body']
        if len(body) < 5:
            raise forms.ValidationError("Comment is too short.")
        return body`)}

<p>Django validates field types automatically based on the model (an email field rejects non-email text, for instance). A <code class="inline">clean_&lt;fieldname&gt;</code> method adds your own custom rule on top, and <code class="inline">form.errors</code> is available in the template to show what went wrong.</p>

${callout('real','REAL-WORLD CASE', `<p>This exact pattern — ModelForm, GET/POST branching, redirect after success — is how you'll build a login form, a checkout form, a signup form, a settings page. Once you've built one of these, you've effectively learned the shape of nearly every form-handling view you'll ever write in Django.</p>`)}

${exercise(`<p>Add server-side validation to the <code class="inline">CommentForm</code> requiring <code class="inline">author_name</code> to be at least 2 characters. Update the template to display <code class="inline">{{ form.errors }}</code> above the form, and test it by submitting an empty form.</p>`)}
`
});

addChapter({
  id:'dj-static-deploy',
  part:'Django · Foundations',
  track:'dj',
  num:'19',
  title:'Static Files and Running in Production',
  dek:'The gap between "works on my laptop" and "works on the internet" — CSS, images, and the settings that change between development and a live server.',
  content:`
<h2>Static files in development</h2>
${code('python','mysite/settings.py',`STATIC_URL = 'static/'`)}
${code('bash','structure',`blog/
  static/
    blog/
      style.css
      logo.png`)}
${code('django','blog/templates/blog/base.html',`{% load static %}
<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>
...`)}

<p>Just like templates, static files live inside <code class="inline">app_name/static/app_name/</code> — the doubled app name namespaces files so two apps can each have their own <code class="inline">style.css</code> without colliding.</p>

<h2>Collecting static files for production</h2>
${code('bash','terminal',`python3 manage.py collectstatic`)}
<p>This gathers every app's static files into one folder (<code class="inline">STATIC_ROOT</code>) that your production web server serves directly — Django itself doesn't serve static files efficiently in production; that's the job of a dedicated server like Nginx or a service like WhiteNoise/S3.</p>

<h2>Settings that must change for production</h2>
${code('python','mysite/settings.py',`import os

DEBUG = False   # NEVER True in production — it leaks stack traces and source code

ALLOWED_HOSTS = ['yourdomain.com', 'www.yourdomain.com']

SECRET_KEY = os.environ['DJANGO_SECRET_KEY']   # read from environment, never hardcoded

DATABASES = {
    'default': {
        'ENGINE': 'django.db.backends.postgresql',
        'NAME': os.environ['DB_NAME'],
        'USER': os.environ['DB_USER'],
        'PASSWORD': os.environ['DB_PASSWORD'],
        'HOST': os.environ['DB_HOST'],
    }
}`)}

${callout('warn','THE MOST COMMON BEGINNER SECURITY MISTAKE', `<p>Leaving <code class="inline">DEBUG = True</code> in a live production site is one of the most common real-world Django security incidents. It shows visitors full Python stack traces on any error — including environment variables, file paths, and sometimes database credentials. Always set <code class="inline">DEBUG = False</code> before deploying, and never commit your <code class="inline">SECRET_KEY</code> to version control.</p>`)}

<h2>SQLite vs. PostgreSQL</h2>
<p>Django defaults to SQLite (a single file on disk) — perfect for learning and local development, but not built for many simultaneous users. Production Django apps almost always run PostgreSQL, changed with the <code class="inline">DATABASES</code> setting above. Because the ORM abstracts the database, your models and views don't need to change at all.</p>

${callout('real','REAL-WORLD CASE', `<p>A typical production deployment: Gunicorn (or another WSGI server) runs your Django app, Nginx sits in front of it serving static files directly and forwarding dynamic requests to Gunicorn, PostgreSQL holds your data, and environment variables (not files in your repo) hold secrets. Platforms like Railway, Render, or Fly.io automate most of this setup.</p>`)}

${exercise(`<p>Add a <code class="inline">style.css</code> to your blog app's static folder with a couple of basic rules, link it in <code class="inline">base.html</code> using <code class="inline">{% load static %}</code>, and confirm the styling appears when you reload the page.</p>`)}
`
});
