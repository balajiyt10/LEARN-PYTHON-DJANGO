addChapter({
  id:'dj-auth',
  part:'Django · Advanced',
  track:'dj',
  num:'20',
  title:'User Authentication',
  dek:'Signup, login, logout, permissions — Django ships a complete, battle-tested auth system so you never write your own password-hashing code.',
  content:`
<h2>What Django's auth system gives you for free</h2>
<p>The <code class="inline">django.contrib.auth</code> app (installed by default) provides a <code class="inline">User</code> model, secure password hashing, login/logout views, and a permissions framework — all tested by millions of production deployments.</p>

${callout('warn','NEVER WRITE YOUR OWN PASSWORD HASHING', `<p>Storing plain-text passwords, or rolling your own hashing, is one of the most damaging mistakes a beginner can make — a single database leak turns into every user's password being exposed everywhere else they reused it. Django hashes passwords with a strong, salted algorithm (PBKDF2 by default) automatically. There is never a good reason to touch this yourself.</p>`)}

<h2>Login and logout views</h2>
${code('python','mysite/urls.py',`from django.contrib.auth import views as auth_views
from django.urls import path

urlpatterns = [
    path('login/', auth_views.LoginView.as_view(template_name='registration/login.html'), name='login'),
    path('logout/', auth_views.LogoutView.as_view(), name='logout'),
]`)}
${code('django','templates/registration/login.html',`{% extends "blog/base.html" %}
{% block content %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Log in</button>
</form>
{% endblock %}`)}

<h2>A signup view</h2>
${code('python','accounts/views.py',`from django.contrib.auth.forms import UserCreationForm
from django.shortcuts import render, redirect

def signup(request):
    if request.method == 'POST':
        form = UserCreationForm(request.POST)
        if form.is_valid():
            form.save()
            return redirect('login')
    else:
        form = UserCreationForm()
    return render(request, 'registration/signup.html', {'form': form})`)}

<h2>Restricting access to logged-in users</h2>
${code('python','blog/views.py',`from django.contrib.auth.decorators import login_required

@login_required
def create_post(request):
    # only reachable if the user is logged in
    # otherwise redirected to settings.LOGIN_URL
    ...`)}
${code('django','any template',`{% if user.is_authenticated %}
  <p>Welcome back, {{ user.username }}!</p>
  <a href="{% url 'logout' %}">Log out</a>
{% else %}
  <a href="{% url 'login' %}">Log in</a>
{% endif %}`)}

<h2>Checking ownership, not just login status</h2>
${code('python','blog/views.py',`from django.contrib.auth.decorators import login_required
from django.http import HttpResponseForbidden
from django.shortcuts import get_object_or_404, redirect

@login_required
def edit_post(request, slug):
    post = get_object_or_404(Post, slug=slug)
    if post.author != request.user:
        return HttpResponseForbidden("You can't edit someone else's post.")
    # ... proceed with editing`)}

${callout('why','WHY THIS SECOND CHECK IS NECESSARY', `<p><code class="inline">@login_required</code> only confirms <em>someone</em> is logged in — it says nothing about whether they should be allowed to edit <em>this particular</em> post. Forgetting the ownership check is a real, common vulnerability: any logged-in user could edit or delete anyone else's content just by guessing the URL. Authentication (who are you) and authorization (what are you allowed to do) are two different checks, and both matter.</p>`)}

${exercise(`<p>Add a signup page using <code class="inline">UserCreationForm</code>, wire up login/logout URLs, and protect your <code class="inline">create_post</code> view (from earlier chapters, or a new one) with <code class="inline">@login_required</code>. Test by trying to access it while logged out.</p>`)}
`
});

addChapter({
  id:'dj-cbv',
  part:'Django · Advanced',
  track:'dj',
  num:'21',
  title:'Class-Based Views',
  dek:'Once you\'ve written several function-based views by hand, you\'ll notice the same patterns repeating — class-based views package those patterns for you.',
  content:`
<h2>The same view, two ways</h2>
${code('python','blog/views.py — function-based',`from django.shortcuts import render
from .models import Post

def post_list(request):
    posts = Post.objects.filter(published=True)
    return render(request, 'blog/post_list.html', {'posts': posts})`)}
${code('python','blog/views.py — class-based',`from django.views.generic import ListView
from .models import Post

class PostListView(ListView):
    model = Post
    template_name = 'blog/post_list.html'
    context_object_name = 'posts'

    def get_queryset(self):
        return Post.objects.filter(published=True)`)}
${code('python','blog/urls.py',`from .views import PostListView

urlpatterns = [
    path('', PostListView.as_view(), name='post_list'),
]`)}

${callout('why','WHY USE THESE INSTEAD OF PLAIN FUNCTIONS', `<p>A generic <code class="inline">ListView</code> already handles pagination, template naming conventions, and the query-then-render pattern — you override only what differs from the default. This isn't magic: <code class="inline">ListView</code> is just a regular Python class using inheritance, exactly like the <code class="inline">Dog</code>/<code class="inline">Animal</code> example from earlier. Recognizing that is what makes Django's class-based views feel approachable instead of like a black box.</p>`)}

<h2>The common generic views</h2>
<table>
<tr><th>View</th><th>Replaces the pattern of</th></tr>
<tr><td><code class="inline">ListView</code></td><td>Fetch a queryset, render a list template</td></tr>
<tr><td><code class="inline">DetailView</code></td><td>Fetch one object by its URL param, render a detail template</td></tr>
<tr><td><code class="inline">CreateView</code></td><td>Show a form, validate and save on POST</td></tr>
<tr><td><code class="inline">UpdateView</code></td><td>Same as CreateView, pre-filled with an existing object</td></tr>
<tr><td><code class="inline">DeleteView</code></td><td>Confirm, then delete an object</td></tr>
</table>

<h2>CreateView in practice</h2>
${code('python','blog/views.py',`from django.contrib.auth.mixins import LoginRequiredMixin
from django.views.generic.edit import CreateView
from django.urls import reverse_lazy
from .models import Post

class PostCreateView(LoginRequiredMixin, CreateView):
    model = Post
    fields = ['title', 'slug', 'body']
    template_name = 'blog/post_form.html'
    success_url = reverse_lazy('post_list')

    def form_valid(self, form):
        form.instance.author = self.request.user
        return super().form_valid(form)`)}

<p><code class="inline">LoginRequiredMixin</code> is another use of inheritance — mixing in login-required behavior without duplicating the check yourself. <code class="inline">form_valid</code> is a hook Django calls right before saving; overriding it lets you set the current user as the author before the object is written to the database.</p>

${callout('real','REAL-WORLD CASE', `<p>Most production Django codebases mix both styles: simple, one-off views stay as plain functions for clarity, while views that follow a standard CRUD (create/read/update/delete) shape use generic class-based views to cut boilerplate. Knowing both means you pick whichever is clearer for a given situation, rather than being locked into one style.</p>`)}

${exercise(`<p>Rewrite your <code class="inline">post_detail</code> function-based view from earlier as a <code class="inline">DetailView</code>. Then add a <code class="inline">PostUpdateView</code> using <code class="inline">UpdateView</code>, protected so only the post's author can access it (hint: override <code class="inline">get_queryset</code> to filter by <code class="inline">author=self.request.user</code>).</p>`)}
`
});

addChapter({
  id:'dj-orm-advanced',
  part:'Django · Advanced',
  track:'dj',
  num:'22',
  title:'Advanced QuerySets and Performance',
  dek:'The ORM makes it easy to write code that works correctly but performs terribly at scale. This chapter is about the difference — and it matters the moment real traffic hits your site.',
  content:`
<h2>QuerySets are lazy</h2>
${code('python','django shell',`posts = Post.objects.filter(published=True)   # no query has run yet
posts = posts.exclude(author__username='admin')  # still no query
list(posts)   # NOW the query actually executes`)}
<p>A QuerySet describes a query without running it — Django waits until you actually need the data (iterating, calling <code class="inline">list()</code>, printing it). This lets you build up complex filters across multiple lines or functions before hitting the database once.</p>

<h2>The N+1 query problem</h2>
${code('python','the slow way',`# This looks innocent but runs ONE extra query per post
for post in Post.objects.all():
    print(post.author.username)   # each .author access triggers a new query`)}
${output('If there are 100 posts, this runs 101 total queries — one for the posts,\nplus one more for every single post\'s author.')}

${code('python','the fast way',`# select_related follows a ForeignKey in the SAME query, via a SQL JOIN
for post in Post.objects.select_related('author'):
    print(post.author.username)   # no extra query — already loaded`)}

${callout('why','WHY THIS IS THE #1 DJANGO PERFORMANCE BUG', `<p>This mistake is invisible in development with 5 test rows and devastating in production with 50,000 rows — the page that took 40ms locally takes 8 seconds in production because it's silently running hundreds of tiny queries. <code class="inline">select_related</code> (for ForeignKey/OneToOne) and <code class="inline">prefetch_related</code> (for ManyToMany and reverse ForeignKey) are the fix, and recognizing where to add them is a genuinely important skill.</p>`)}

<h2>prefetch_related for many-to-many and reverse relations</h2>
${code('python','django shell',`# without prefetch: 1 query for posts, then 1 more PER POST for its comments
posts = Post.objects.all()
for post in posts:
    print(post.comments.count())

# with prefetch: 1 query for posts, 1 query for ALL comments, joined in Python
posts = Post.objects.prefetch_related('comments')
for post in posts:
    print(post.comments.count())`)}

<h2>Aggregation</h2>
${code('python','django shell',`from django.db.models import Count, Avg

Post.objects.aggregate(total=Count('id'))
# {'total': 42}

Post.objects.annotate(comment_count=Count('comments')).order_by('-comment_count')
# each post now has a .comment_count attribute, sorted by most-commented first`)}

<h2>Only fetching what you need</h2>
${code('python','django shell',`# only pulls title and slug columns from the database, not every field
Post.objects.only('title', 'slug')

# values() returns plain dicts instead of model instances — faster for read-only data
Post.objects.values('title', 'created_at')`)}

${callout('real','REAL-WORLD CASE', `<p>Django ships a tool called <strong>django-debug-toolbar</strong> that shows every SQL query a page ran, including duplicates — this is the standard way real teams catch N+1 problems before they ship. Checking the query count on any page showing a list of related objects (posts with authors, orders with line items) should become a habit.</p>`)}

${exercise(`<p>In the Django shell, fetch all posts with <code class="inline">select_related('author')</code> and <code class="inline">prefetch_related('comments')</code> together in one queryset, then loop through printing each post's title, author username, and comment count — confirm in your terminal output that this doesn't trigger extra queries per post.</p>`)}
`
});

addChapter({
  id:'dj-rest',
  part:'Django · Advanced',
  track:'dj',
  num:'23',
  title:'Building an API with Django REST Framework',
  dek:'Modern apps often need to serve data to a mobile app or a JavaScript frontend, not just render HTML. DRF is the standard toolkit for that.',
  content:`
<h2>Installing and configuring DRF</h2>
${code('bash','terminal',`pip install djangorestframework`)}
${code('python','mysite/settings.py',`INSTALLED_APPS = [
    # ...
    'rest_framework',
    'blog',
]`)}

<h2>Serializers: converting models to JSON and back</h2>
${code('python','blog/serializers.py',`from rest_framework import serializers
from .models import Post

class PostSerializer(serializers.ModelSerializer):
    author = serializers.ReadOnlyField(source='author.username')

    class Meta:
        model = Post
        fields = ['id', 'title', 'slug', 'body', 'author', 'created_at']`)}

<p>A serializer is the API equivalent of a ModelForm: it validates incoming data and controls exactly which fields go out as JSON. Notice <code class="inline">author</code> is exposed as just the username, not the full nested user object — deciding what to expose is a deliberate design choice, not automatic.</p>

<h2>A full CRUD API in a few lines</h2>
${code('python','blog/views.py',`from rest_framework import viewsets, permissions
from .models import Post
from .serializers import PostSerializer

class PostViewSet(viewsets.ModelViewSet):
    queryset = Post.objects.filter(published=True)
    serializer_class = PostSerializer
    permission_classes = [permissions.IsAuthenticatedOrReadOnly]

    def perform_create(self, serializer):
        serializer.save(author=self.request.user)`)}
${code('python','mysite/urls.py',`from rest_framework.routers import DefaultRouter
from blog.views import PostViewSet

router = DefaultRouter()
router.register('posts', PostViewSet)

urlpatterns = [
    path('api/', include(router.urls)),
]`)}

<p>A <code class="inline">ModelViewSet</code> combined with a <code class="inline">DefaultRouter</code> generates the full REST convention automatically:</p>
<table>
<tr><th>Method + URL</th><th>Action</th></tr>
<tr><td><code class="inline">GET /api/posts/</code></td><td>List all posts</td></tr>
<tr><td><code class="inline">POST /api/posts/</code></td><td>Create a post</td></tr>
<tr><td><code class="inline">GET /api/posts/5/</code></td><td>Retrieve post #5</td></tr>
<tr><td><code class="inline">PUT /api/posts/5/</code></td><td>Replace post #5</td></tr>
<tr><td><code class="inline">DELETE /api/posts/5/</code></td><td>Delete post #5</td></tr>
</table>

${callout('why','WHY permission_classes MATTERS HERE', `<p><code class="inline">IsAuthenticatedOrReadOnly</code> means anyone can <code class="inline">GET</code> (read) posts, but only logged-in users can <code class="inline">POST</code>/<code class="inline">PUT</code>/<code class="inline">DELETE</code> (write). Without an explicit permission class, DRF's default can vary by project configuration — always set this consciously rather than relying on the default, since an unintentionally open write endpoint is a real, serious vulnerability.</p>`)}

${callout('real','REAL-WORLD CASE', `<p>This is precisely how a React or mobile frontend talks to a Django backend: the frontend calls <code class="inline">/api/posts/</code>, gets JSON back, and renders its own UI from it — Django never touches HTML in that scenario. This "Django as a pure API backend" architecture is extremely common in real production systems, often paired with a separate frontend framework.</p>`)}

${exercise(`<p>Add a <code class="inline">CommentViewSet</code> and register it at <code class="inline">/api/comments/</code>. Test it using <code class="inline">curl</code> or the browsable API DRF provides automatically at that URL in your browser.</p>`)}
`
});

addChapter({
  id:'dj-testing',
  part:'Django · Advanced',
  track:'dj',
  num:'24',
  title:'Testing Django Applications',
  dek:'Untested code is code you\'re afraid to change. Django\'s test framework makes it realistic to test models, views, and forms without much extra setup.',
  content:`
<h2>Why tests matter more in web apps, not less</h2>
${callout('why','WHY THIS MATTERS', `<p>A web app has many interacting layers — URLs, views, models, templates, forms, permissions. A change in one place (renaming a model field, adjusting a permission) can silently break something in a completely different view. Automated tests catch that break in seconds, before a real user finds it in production.</p>`)}

<h2>Testing a model</h2>
${code('python','blog/tests.py',`from django.test import TestCase
from django.contrib.auth.models import User
from .models import Post

class PostModelTests(TestCase):
    def setUp(self):
        self.user = User.objects.create_user(username='maria', password='testpass123')

    def test_string_representation(self):
        post = Post.objects.create(title="Test Post", slug="test-post", author=self.user)
        self.assertEqual(str(post), "Test Post")

    def test_default_published_is_false(self):
        post = Post.objects.create(title="Draft", slug="draft", author=self.user)
        self.assertFalse(post.published)`)}

<h2>Testing a view</h2>
${code('python','blog/tests.py',`class PostListViewTests(TestCase):
    def setUp(self):
        self.user = User.objects.create_user(username='maria', password='testpass123')
        Post.objects.create(title="Published", slug="published", author=self.user, published=True)
        Post.objects.create(title="Draft", slug="draft", author=self.user, published=False)

    def test_only_published_posts_appear(self):
        response = self.client.get('/')
        self.assertEqual(response.status_code, 200)
        self.assertContains(response, "Published")
        self.assertNotContains(response, "Draft")

    def test_create_post_requires_login(self):
        response = self.client.get('/post/new/')
        self.assertEqual(response.status_code, 302)   # redirected to login`)}

<p><code class="inline">self.client</code> is a test client that simulates a browser making requests, without needing a real running server. Each test method starts from a clean, isolated test database — tests can never accidentally affect each other or your real data.</p>

<h2>Running tests</h2>
${code('bash','terminal',`python3 manage.py test`)}

<h2>The brief</h2>
<p>Build a small <strong>task board</strong> application — like a minimal Trello. This project deliberately touches every layer you've learned: models and relationships, the ORM, auth and permissions, forms, class-based views, templates, and (optionally) a JSON API.</p>

<h2>Suggested data model</h2>
${code('python','boards/models.py',`from django.db import models
from django.contrib.auth.models import User

class Board(models.Model):
    name = models.CharField(max_length=100)
    owner = models.ForeignKey(User, on_delete=models.CASCADE, related_name='boards')
    created_at = models.DateTimeField(auto_now_add=True)

    def __str__(self):
        return self.name

class Task(models.Model):
    STATUS_CHOICES = [
        ('todo', 'To Do'),
        ('doing', 'In Progress'),
        ('done', 'Done'),
    ]
    board = models.ForeignKey(Board, on_delete=models.CASCADE, related_name='tasks')
    title = models.CharField(max_length=200)
    description = models.TextField(blank=True)
    status = models.CharField(max_length=10, choices=STATUS_CHOICES, default='todo')
    assigned_to = models.ForeignKey(User, on_delete=models.SET_NULL, null=True, blank=True)
    created_at = models.DateTimeField(auto_now_add=True)

    def __str__(self):
        return self.title`)}

<p><code class="inline">choices</code> restricts <code class="inline">status</code> to a fixed set of valid values, and Django's admin and forms automatically render it as a dropdown — a small detail that prevents a whole category of bad data.</p>

<h2>Build order — a realistic path</h2>
<ol>
  <li><strong>Models + migrations.</strong> Get <code class="inline">Board</code> and <code class="inline">Task</code> into the database. Register both in <code class="inline">admin.py</code> so you can create test data instantly without building any UI first.</li>
  <li><strong>Auth.</strong> Signup, login, logout. Every board should belong to a user, and only that user (or people they've shared it with) should see it.</li>
  <li><strong>Board list + detail views.</strong> A <code class="inline">ListView</code> for "my boards," a <code class="inline">DetailView</code> for one board showing its tasks grouped by status.</li>
  <li><strong>Task creation and status updates.</strong> A <code class="inline">CreateView</code> for new tasks, and a small view that updates just the <code class="inline">status</code> field (hint: this is a good place for a simple function-based view handling a POST from a small form or button).</li>
  <li><strong>Permissions.</strong> Confirm — with tests — that a user can't view or edit a board they don't own.</li>
  <li><strong>Performance pass.</strong> Once the board detail view is working, check it with <code class="inline">select_related('assigned_to')</code> on the task queryset, since you're about to loop over tasks and access <code class="inline">assigned_to.username</code> for each.</li>
  <li><strong>Tests.</strong> At minimum: creating a board, creating a task, an unauthorized user being blocked from someone else's board.</li>
</ol>

${callout('why','WHY THIS ORDER, SPECIFICALLY', `<p>Building the admin-registered models first means you have real data to work with before writing a single line of view or template code — you're never staring at an empty database wondering if your view logic is even correct. Adding permissions <em>after</em> the views work, but <em>before</em> you consider it done, mirrors how real bugs happen: functionality first, then the security review that catches what you missed.</p>`)}

${callout('real','REAL-WORLD CASE', `<p>This project's shape — a resource owned by a user, containing child objects, with status tracking and access control — is the skeleton underneath an enormous number of real products: task trackers, CRMs, ticketing systems, content management systems. Once you've built this once, you'll recognize the same shape everywhere.</p>`)}

<h2>Where to go from here</h2>

</ul>

<script>
let currentChapter = null;

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function buildNav(){
  const container = document.getElementById('nav-container');
  let html = '';
  let currentPart = null;
  CHAPTERS.forEach((ch, i) => {
    if(ch.part !== currentPart){
      currentPart = ch.part;
      html += `<div class="nav-part"><div class="nav-part-label ${ch.track}">${ch.part}</div>`;
    }
    html += `<a href="#${ch.id}" class="nav-link" data-id="${ch.id}"><span class="num">${ch.num}</span>${ch.title}</a>`;
    const nextCh = CHAPTERS[i+1];
    if(!nextCh || nextCh.part !== currentPart){
      html += `</div>`;
    }
  });
  container.innerHTML = html;
}

function renderChapter(id){
  const ch = CHAPTERS.find(c => c.id === id) || CHAPTERS[0];
  currentChapter = ch;
  const idx = CHAPTERS.indexOf(ch);
  const prev = CHAPTERS[idx-1];
  const next = CHAPTERS[idx+1];

  let nav = `<div class="chapter-nav">`;
  nav += prev ? `<a href="#${prev.id}"><span class="dir">← previous</span>${prev.title}</a>` : `<span></span>`;
  nav += next ? `<a href="#${next.id}" class="next"><span class="dir">next →</span>${next.title}</a>` : `<span></span>`;
  nav += `</div>`;

  document.getElementById('main-content').innerHTML =
    `<div class="chapter-eyebrow ${ch.track}">${ch.part} · Chapter ${ch.num}</div>
     <h1 class="chapter-title">${ch.title}</h1>
     <p class="chapter-dek">${ch.dek}</p>
     ${ch.content}
     ${nav}`;

  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  const activeLink = document.querySelector(`.nav-link[data-id="${id}"]`);
  if(activeLink){
    activeLink.classList.add('active');
    activeLink.scrollIntoView({block:'center', behavior:'smooth'});
  }

  highlightAllCode();
  window.scrollTo(0,0);
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

/* ---- Minimal, dependency-free syntax highlighter ---- */
function highlightCode(src, lang){
  let s = src;
  // Escape already done by caller before this runs (we re-escape safely below)
  const isPython = lang === 'python';
  const isDjango = lang === 'django';
  const isBash = lang === 'bash';
  const isXml = lang === 'xml' || isDjango;

  if(isPython){
    // comments first (protect from further token matching using placeholders)
    const placeholders = [];
    const stash = (match) => { placeholders.push(match); return `\u0000${placeholders.length-1}\u0000`; };

    s = s.replace(/(#.*?)(?=\n|$)/g, m => stash(`<span class="tok-com">${m}</span>`));
    s = s.replace(/("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, m => stash(`<span class="tok-str">${m}</span>`));
    s = s.replace(/@[A-Za-z_][\w.]*/g, m => stash(`<span class="tok-deco">${m}</span>`));
    s = s.replace(/\b(\d+\.?\d*)\b/g, m => stash(`<span class="tok-num">${m}</span>`));
    s = s.replace(/\b(def|class|import|from|as|return|if|elif|else|for|while|in|is|not|and|or|try|except|finally|raise|with|pass|break|continue|lambda|yield|global|nonlocal|assert|del|async|await)\b/g, m => `<span class="tok-kw">${m}</span>`);
    s = s.replace(/\b(True|False|None|self)\b/g, m => `<span class="tok-builtin">${m}</span>`);
    s = s.replace(/\b([A-Za-z_]\w*)(?=\()/g, m => `<span class="tok-fn">${m}</span>`);

    s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => placeholders[i]);
  } else if(isBash){
    const placeholders = [];
    const stash = (match) => { placeholders.push(match); return `\u0000${placeholders.length-1}\u0000`; };
    s = s.replace(/(#.*?)(?=\n|$)/g, m => stash(`<span class="tok-com">${m}</span>`));
    s = s.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, m => stash(`<span class="tok-str">${m}</span>`));
    s = s.replace(/^\s*\$?\s*\b(pip|python3?|django-admin|source|cd|mkdir|curl|git|npm|export|manage\.py)\b/gm, m => `<span class="tok-kw">${m}</span>`);
    s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => placeholders[i]);
  } else if(isXml){
    // HTML / Django template highlighting
    const placeholders = [];
    const stash = (match) => { placeholders.push(match); return `\u0000${placeholders.length-1}\u0000`; };
    // Django template tags {% %} and {{ }}
    s = s.replace(/(\{%[\s\S]*?%\}|\{\{[\s\S]*?\}\})/g, m => stash(`<span class="tok-deco">${m}</span>`));
    // HTML comments
    s = s.replace(/(&lt;!--[\s\S]*?--&gt;)/g, m => stash(`<span class="tok-com">${m}</span>`));
    // tags
    s = s.replace(/(&lt;\/?)([a-zA-Z][\w-]*)/g, (m, p1, p2) => `${p1}<span class="tok-tag">${p2}</span>`);
    // attributes
    s = s.replace(/([a-zA-Z-]+)(=)(&quot;[^&]*?&quot;)/g, (m, attr, eq, val) => `<span class="tok-attr">${attr}</span>${eq}<span class="tok-str">${val}</span>`);
    s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => placeholders[i]);
  }
  return s;
}

function highlightAllCode(){
  document.querySelectorAll('pre code[data-lang]').forEach(block => {
    const lang = block.getAttribute('data-lang');
    const raw = block.getAttribute('data-raw');
    block.innerHTML = highlightCode(raw, lang);
  });
}

function copyCode(btn){
  const code = btn.closest('.code-wrap').querySelector('code').innerText;
  navigator.clipboard.writeText(code);
  const orig = btn.innerText;
  btn.innerText = 'copied';
  setTimeout(()=>btn.innerText = orig, 1200);
}

window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1) || CHAPTERS[0].id;
  renderChapter(id);
});

buildNav();
renderChapter(location.hash.slice(1) || CHAPTERS[0].id);
</script>
